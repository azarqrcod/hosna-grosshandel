<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HOSNA GROSSHANDELN</title>
    <link rel="icon" href="assets/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="hero reveal" aria-labelledby="heroTitle">
        <div class="orb orb-one" aria-hidden="true"></div>
        <div class="orb orb-two" aria-hidden="true"></div>
        <img class="logo" src="assets/logo.png" alt="HOSNA GROSSHANDELN Logo" />
        <p class="eyebrow">Willkommen bei</p>
        <h1 id="heroTitle">HOSNA GROSSHANDELN</h1>
        <p class="hero-subtitle">Ihr zuverlässiger Großhandelspartner in Berlin</p>
      </section>

      <nav class="contact-panel reveal" aria-label="Kontakt">
        <a class="glass-button" id="whatsappLink" href="#">
          <img src="assets/icons/whatsapp.svg" alt="" aria-hidden="true" />
          <span>WhatsApp</span>
        </a>
        <a class="glass-button" id="instagramLink" href="#">
          <img src="assets/icons/instagram.svg" alt="" aria-hidden="true" />
          <span>Instagram</span>
        </a>
        <a class="glass-button" id="emailLink" href="#">
          <img src="assets/icons/email.svg" alt="" aria-hidden="true" />
          <span>E-Mail</span>
        </a>
        <a class="glass-button" id="mapsLink" href="#">
          <img src="assets/icons/location.svg" alt="" aria-hidden="true" />
          <span>Google Maps</span>
        </a>
      </nav>

      <section class="products reveal" aria-labelledby="productsTitle">
        <div class="section-kicker">Unsere Auswahl</div>
        <h2 id="productsTitle">UNSERE PRODUKTE</h2>
        <div class="product-grid" id="productGrid" aria-live="polite"></div>
      </section>

      <section class="azarcore-card reveal" aria-labelledby="azarcoreTitle">
        <div class="card-shine" aria-hidden="true"></div>
        <h2 id="azarcoreTitle">Brauchen Sie Ihre eigene QR-Website?</h2>
        <p>Professionelle QR-Webseiten für Unternehmen.</p>
        <a class="azarcore-link" href="https://azarqrcod.github.io/azarcore">AzarCore besuchen</a>
      </section>
    </main>

    <dialog class="image-dialog" id="imageDialog" aria-label="Produktbild">
      <button class="close-button" id="closeDialog" type="button" aria-label="Schließen">×</button>
      <img id="largeImage" alt="" />
    </dialog>

    <footer class="footer">AzarCore © 2026</footer>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
